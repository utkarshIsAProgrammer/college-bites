<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rush Bites">
  <defs>
    <clipPath id="cbNoodlesF"><circle cx="32" cy="32" r="25"/></clipPath>
  </defs>

  <!-- plate, full bleed: touches all four edges -->
  <circle cx="32" cy="32" r="31" fill="#F7F4EE" stroke="#17130E" stroke-width="4"/>

  <!-- noodles: three bold waves -->
  <g clip-path="url(#cbNoodlesF)" stroke="#17130E" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M8 28 q7 -6 14 0 t14 0 t14 0"/>
    <path d="M10 39 q6.5 -5.5 13 0 t13 0 t13 0"/>
    <path d="M13 49 q6 -5 12 0 t12 0 t12 0"/>
  </g>

  <!-- cutlery, enlarged -->
  <g transform="translate(32 32) scale(1.18) translate(-32 -32)">
    <!-- fork (tilted left) -->
    <g fill="#17130E" transform="rotate(-20 32 44)">
      <rect x="24.5" y="10" width="3" height="15" rx="1.5"/>
      <rect x="30.5" y="10" width="3" height="15" rx="1.5"/>
      <rect x="36.5" y="10" width="3" height="15" rx="1.5"/>
      <path d="M22.25 23.5h19.5c0 4.6-3 7.3-6.6 7.3h-6.3c-3.6 0-6.6-2.7-6.6-7.3z"/>
      <rect x="29.6" y="29.8" width="4.8" height="26" rx="2.4"/>
    </g>

    <!-- spoon (tilted right, paper outline separates it) -->
    <g fill="#17130E" stroke="#F7F4EE" stroke-width="1.8" transform="rotate(20 32 44)">
      <ellipse cx="32" cy="17" rx="6.6" ry="9"/>
      <rect x="29.6" y="28" width="4.8" height="27" rx="2.4"/>
    </g>
  </g>

  <!-- ember garnish on the paper -->
  <circle cx="45" cy="13" r="3.4" fill="#D75A1E"/>
</svg>
